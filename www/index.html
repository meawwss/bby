<div class="np-root">

  <div id="now-playing-card" class="np-card np-hidden">

    <!-- Couche étoiles ambiantes (derrière le contenu, clippée à la pilule) -->
    <div class="np-fx-ambient" id="np-fx-ambient"></div>

    <!-- Contenu de la pilule -->
    <div class="np-content">

      <div class="np-play-icon">
        <svg viewBox="1.5 0 24 24">
          <path d="M9 18V5l11-2v13"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"/>
          <circle cx="7" cy="18" r="3" fill="currentColor"/>
          <circle cx="20" cy="16" r="3" fill="currentColor"/>
        </svg>
      </div>

      <div class="np-title-wrap">
        <span id="np-title" class="np-marquee-text">Blinding Lights</span>
      </div>

      <div class="np-star-sep"></div>

      <div class="np-artist-wrap">
        <span id="np-artist" class="np-marquee-text">The Weeknd</span>
      </div>

      <div class="np-divider">
        <span></span><span></span><span></span>
      </div>

      <div class="np-progress-track">
        <div id="np-progress-bar" class="np-progress-bar">
          <div class="np-sparkle"></div>
        </div>
      </div>

    </div>
  </div>

  <!-- Couche étoiles apparition/disparition (au-dessus, hors carte pour survivre au fondu) -->
  <div class="np-fx-burst" id="np-fx-burst"></div>

</div>
